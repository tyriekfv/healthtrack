# i18n Bootstrap: regenerates package-lock.json on the localization branch
# and commits it back. Temporary/branch-scoped — the next-intl dependency was
# added to package.json by hand (no Node available in the authoring
# environment to run `npm install` and produce a correct lockfile), so `npm
# ci` would otherwise fail everywhere (CI, Docker build) until the lockfile
# actually reflects it. Safe to delete once this branch merges to main.
name: i18n Bootstrap (lockfile)

on:
  push:
    branches:
      - feature/spanish-localization
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i18n-bootstrap
  cancel-in-progress: false

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install (regenerates package-lock.json for new deps)
        run: npm install

      - name: Commit updated lockfile, if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore: sync package-lock.json for next-intl [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
