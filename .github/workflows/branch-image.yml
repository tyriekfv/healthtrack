# Branch Image: builds a test image from feature/trt-cycle-tracking on every
# push, so it can be pulled without ever touching :latest or main. Unlike
# release.yml (tag-triggered, multi-arch, stamps :latest) this is single-arch
# (linux/amd64) and always pushes the SAME fixed tag — meant for iterating on
# one branch on one Unraid host, not for a real release.
#
# Also regenerates any pending Drizzle migration (drizzle-kit needs Node,
# which the branch author's environment didn't have) and commits it back to
# the branch before building, so the image always ships with a migration file
# matching the current schema.
name: Branch Image (cycle-tracking)

on:
  push:
    branches:
      - feature/trt-cycle-tracking
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: branch-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate pending Drizzle migrations
        run: npx drizzle-kit generate

      - name: Commit generated migration, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drizzle
          if git diff --cached --quiet; then
            echo "No new migration to commit"
          else
            git commit -m "chore: generate drizzle migration [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Prepare env (lowercase image ref)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:cycle-tracking
          cache-from: type=gha,scope=branch-cycle-tracking
          cache-to: type=gha,mode=max,scope=branch-cycle-tracking
